<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New enquiry — {{from_name}}</title>
</head>
<body style="margin:0;padding:0;background:#EEF0F5;font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EEF0F5;padding:32px 12px;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;">

  <!-- header -->
  <tr><td style="background:#0C1A3C;background-image:linear-gradient(135deg,#0C1A3C 0%,#122659 100%);border-radius:16px 16px 0 0;padding:34px 40px 28px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="font-family:Georgia,'Times New Roman',serif;font-size:26px;letter-spacing:.08em;color:#4f8fff;font-weight:700;">AJ.</td>
      <td align="right" style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#C9A961;">New enquiry</td>
    </tr></table>
    <div style="height:1px;background:#C9A961;opacity:.45;margin:22px 0 20px;"></div>
    <div style="font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.15;color:#FFFFFF;font-weight:400;">{{from_name}} <span style="color:#C9A961;font-style:italic;">reached out</span></div>
    <div style="font-family:'Courier New',monospace;font-size:12px;letter-spacing:.1em;color:#A9B3CB;margin-top:10px;">via akibullah.github.io/portfolio</div>
  </td></tr>

  <!-- details -->
  <tr><td style="background:#FFFFFF;padding:32px 40px 8px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:14px;color:#1B2233;">
      <tr>
        <td style="padding:0 0 14px;width:110px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7F601C;vertical-align:top;padding-top:3px;">From</td>
        <td style="padding:0 0 14px;font-weight:600;color:#0C1A3C;">{{from_name}}</td>
      </tr>
      <tr>
        <td style="padding:0 0 14px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7F601C;vertical-align:top;padding-top:3px;">Email</td>
        <td style="padding:0 0 14px;"><a href="mailto:{{from_email}}" style="color:#1a4fd6;text-decoration:none;font-weight:600;">{{from_email}}</a></td>
      </tr>
      <tr>
        <td style="padding:0 0 14px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7F601C;vertical-align:top;padding-top:3px;">Subject</td>
        <td style="padding:0 0 14px;color:#1B2233;">{{subject}}</td>
      </tr>
    </table>
  </td></tr>

  <!-- message -->
  <tr><td style="background:#FFFFFF;padding:6px 40px 34px;">
    <div style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7F601C;margin-bottom:12px;">Message</div>
    <div style="border-left:3px solid #C9A961;background:#FCFBF7;border-radius:0 10px 10px 0;padding:20px 22px;font-size:15px;line-height:1.7;color:#1B2233;white-space:pre-wrap;">{{message}}</div>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;"><tr>
      <td style="background:#0C1A3C;border-radius:8px;">
        <a href="mailto:{{from_email}}?subject=Re:%20{{subject}}" style="display:inline-block;padding:14px 28px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF;text-decoration:none;font-weight:700;">Reply to {{from_name}}</a>
      </td>
    </tr></table>
  </td></tr>

  <!-- footer -->
  <tr><td style="background:#F7F8FB;border-radius:0 0 16px 16px;padding:20px 40px;border-top:1px solid #E4E0D5;">
    <div style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#66708A;">Portfolio contact form · Dhaka, BD</div>
  </td></tr>

</table>
</td></tr>
</table>
</body>
</html>
